# GitHub Pages publishes the browser app; native sources stay in the repository.
include:
  - .well-known
exclude:
  - android
  - ios
  - native
  - scripts
  - release
  - release.config.json
  - artifacts
  - node_modules
  - dist
  - README.md
  - package.json
  - package-lock.json
  - capacitor.config.json
  - server.js
  - make-assets.js
  - test-score.js
  - test-smoke.js
  - test-sw.js
